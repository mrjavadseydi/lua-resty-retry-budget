worker_processes 2;
worker_rlimit_nofile 8192;
error_log /tmp/nginx/logs/error.log warn;
pid /tmp/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log off;
    lua_code_cache on;
    lua_package_path "/src/lib/?.lua;/src/bench/?.lua;;";
    lua_shared_dict retry_budget 10m;
    lua_shared_dict bench_state 1m;

    client_body_temp_path /tmp/nginx/client_body_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    init_by_lua_block {
        require "resty.core"
    }

    # One placeholder. Extra server lines would start peer.tries above 1
    # and the bench would no longer be arming the retries itself.
    upstream naive_up {
        server 0.0.0.1;
        balancer_by_lua_block {
            require("naive").run()
        }
    }

    upstream budget_up {
        server 0.0.0.1;
        balancer_by_lua_block {
            require("budget").run()
        }
    }

    server {
        listen 127.0.0.1:1986 reuseport;
        location / {
            content_by_lua_block {
                local n = ngx.shared.bench_state:incr("upstream", 1, 0)
                if n % 2 == 1 then
                    ngx.status = 503
                    ngx.header["Content-Type"] = "text/plain"
                    ngx.say("no")
                    return
                end
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("ok")
            }
        }
        location /fast {
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("ok")
            }
        }
    }

    server {
        listen 127.0.0.1:8080 reuseport;
        location = /health {
            content_by_lua_block {
                ngx.say("ok")
            }
        }
        location = /reset {
            content_by_lua_block {
                ngx.shared.bench_state:flush_all()
                ngx.say("ok")
            }
        }
        location = /counters {
            content_by_lua_block {
                local d = ngx.shared.bench_state
                local keys = {
                    "upstream",
                    "naive_client", "budget_client",
                    "naive_attempt_1", "naive_attempt_2", "naive_attempt_3",
                    "naive_attempt_4", "naive_attempt_other", "naive_armed",
                    "budget_attempt_1", "budget_attempt_2", "budget_attempt_3",
                    "budget_attempt_4", "budget_attempt_other",
                    "budget_armed", "budget_acquire_denied",
                }
                for i = 1, #keys do
                    ngx.say(keys[i], " ", d:get(keys[i]) or 0)
                end
            }
        }
        location = /budget-stats {
            content_by_lua_block {
                local st = require("budget").stats()
                ngx.say("requests ", st.requests)
                ngx.say("retries ", st.retries)
                ngx.say("allowance ", st.allowance)
                ngx.say("rejected ", st.rejected)
            }
        }
        location = /happy {
            content_by_lua_block {
                require("happy").run()
            }
        }
        location /naive {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            proxy_next_upstream error http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_pass http://naive_up;
            log_by_lua_block {
                ngx.shared.bench_state:incr("naive_client", 1, 0)
            }
        }
        location /budget {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            proxy_next_upstream error http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_pass http://budget_up;
            log_by_lua_block {
                ngx.shared.bench_state:incr("budget_client", 1, 0)
            }
        }
    }
}
