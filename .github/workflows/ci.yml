name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: luajit-openresty
      - uses: leafo/gh-actions-luarocks@v5
        with:
          luaRocksVersion: "3.12.2" # JSON manifests avoid LuaJIT's constant limit.
      - name: Install busted
        run: luarocks install busted
      - name: Rockspec builds and installs
        run: luarocks make lua-resty-retry-budget-0.1.0-1.rockspec
      - name: Unit tests and global-write check
        run: |
          make test
          make gset LUAJIT=luajit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test::Nginx
        run: bash t/docker-prove.sh
